<script>
  /* apply the saved theme before first paint so there is no flash */
  try {
    var s = JSON.parse(localStorage.getItem('grevocab.v1') || '{}').settings || {};
    if (s.theme === 'dark' || s.theme === 'light') document.documentElement.setAttribute('data-theme', s.theme);
    if (s.size) document.documentElement.style.setProperty('--scale', s.size);
  } catch (e) {}
</script>
